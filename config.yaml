random_state: 42

data:
  uci_id: 94
  path: data/raw/spambase.csv
  train_path: data/processed/train.csv
  test_path: data/processed/test.csv

split:
  test_size: 0.2

# 5 folds is the usual default (and scikit-learn's): each fold still has
# about 670 emails to score on, and the grid needs only 5 fits per setting.
cv:
  n_splits: 5
  scoring: average_precision

# Hyperparameter grids searched by GridSearchCV, one per model.
# "model__" means "a parameter of the pipeline step called model".
grids:
  logistic_regression:
    model__C: [0.01, 0.1, 1, 10, 100]
    model__penalty: [l1, l2]
  knn:
    # Number of neighbours, and whether closer neighbours count more (distance).
    model__n_neighbors: [5, 11, 15, 21, 31, 51]
    model__weights: [uniform, distance]
  linear_svm:
    # Regularisation strength, as for logistic regression.
    model__C: [0.01, 0.1, 1, 10, 100]

# The model trained by the CLI, where it is saved, and the decision threshold.
model:
  name: logistic_regression
  path: models/spamjam.joblib
  # Precision on spam we aim for (GrandPied: blocking a client email is costly).
  target_precision: 0.95
  # Lowest threshold that reaches target_precision on the out-of-fold
  # predictions (see "Decision threshold" in notebooks/analysis.ipynb).
  threshold: 0.782
  # Second version: the same model trained without the donor's words
  # (features.donor_columns), with its own threshold chosen the same way
  # (see "Second version" in notebooks/analysis.ipynb).
  without_donor_words:
    path: models/spamjam_without_donor_words.joblib
    threshold: 0.82

# The Streamlit page (streamlit run src/spamjam/app.py).
app:
  example_path: examples/new_case.json

features:
  # Words that describe the dataset's donor (George, at HP Labs) rather than spam.
  # The main model keeps them; the second version (model.without_donor_words)
  # is trained without them.
  donor_columns:
    - word_freq_george
    - word_freq_hp
    - word_freq_hpl
    - word_freq_650
    - word_freq_857
    - word_freq_415
    - word_freq_labs
    - word_freq_telnet
    - word_freq_technology

# Charts saved by the notebooks, for the report and the slides.
output:
  results_dir: results

random_state: 42

data:
  uci_id: 94
  path: data/raw/spambase.csv
  train_path: data/processed/train.csv
  test_path: data/processed/test.csv

split:
  test_size: 0.2

# 5 folds is the usual default (and scikit-learn's): each fold still has
# about 670 emails to score on, and the grid needs only 5 fits per setting.
cv:
  n_splits: 5
  scoring: average_precision

# Hyperparameter grids searched by GridSearchCV, one per model.
# "model__" means "a parameter of the pipeline step called model".
grids:
  logistic_regression:
    model__C: [0.01, 0.1, 1, 10]
    model__penalty: [l1, l2]
  knn:
    #Tuning the number of neighbors(k)
    model__n_neighbors: [3, 5, 7, 9, 11, 15]
  linear_svm:
    #Tuning the regularization parameter C for the SVM
    model__C: [0.01, 0.1, 1, 10]

# The model trained by the CLI, where it is saved, and the decision threshold.
model:
  name: logistic_regression
  path: models/spamjam.joblib
  threshold: 0.5

features:
  # Words that describe the dataset's donor (George, at HP Labs) rather than spam.
  # Used only for the comparison in notebooks/analysis.ipynb: we keep them in the
  # model and report the dependence as a limitation (see the decision there).
  donor_columns:
    - word_freq_george
    - word_freq_hp
    - word_freq_hpl
    - word_freq_650
    - word_freq_857
    - word_freq_415
    - word_freq_labs
    - word_freq_telnet
    - word_freq_technology

#Target precision
threshold:
  target_precision: 0.95
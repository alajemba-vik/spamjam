[project]
name = "spamjam"
version = "0.1.0"
description = "Spam detection for GrandPied"
requires-python = ">=3.10"
# Everything is installed with one `pip install -e .`: the notebooks (Jupyter
# kernel), the tests (pytest), the quality checks (ruff) and the Streamlit page
# are part of the project, not optional extras.
dependencies = [
    "altair==6.3.0",
    "ipykernel==7.3.0",
    "joblib==1.6.0",
    "matplotlib==3.10.9",
    # No single numpy version supports both Python 3.10 and 3.14, so we pin one
    # per Python version.
    "numpy==2.2.6; python_version < '3.11'",
    "numpy==2.3.5; python_version >= '3.11'",
    "pandas==2.3.3",
    "pytest==8.4.2",
    "pyyaml==6.0.3",
    "ruff==0.14.0",
    "scikit-learn==1.7.2",
    # Streamlit 1.66 and later need Python 3.11, so we stay on 1.60.
    "streamlit==1.60.0",
    "ucimlrepo==0.0.7",
]

# Installs the `spamjam` command, which runs main() in cli.py.
[project.scripts]
spamjam = "spamjam.cli:main"

[build-system]
# Tool pip uses to build and install this package (not needed at runtime).
# A minimum version, not a pin: building doesn't affect our results.
requires = ["setuptools>=68"]
# The function inside setuptools that pip calls to do the build.
build-backend = "setuptools.build_meta"

[tool.ruff.lint]
# E/W: PEP 8 style, F: errors (unused imports...), I: import order,
# N: PEP 8 names, D1: a docstring on every public module, class and function.
select = ["E", "F", "W", "I", "N", "D1"]
# X (the data matrix) is scikit-learn's naming convention, so we keep it.
ignore = ["N803", "N806"]

[tool.ruff.lint.per-file-ignores]
# Test names already describe what they check; notebooks explain in markdown.
"tests/*" = ["D1"]
"notebooks/*" = ["D1"]
